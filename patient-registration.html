<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Registration</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="form.css">
    <style>
        nav { font-size: 0.98rem; }
        nav a { text-decoration: none; }
        nav a:hover { text-decoration: underline; }
    </style>
</head>

<body>

    <header style="background-color: #0b5c8e; color: #ffffff; padding: 28px 20px; border: 2px solid #083b5c;">
        <h1 style="color: #ffffff; text-align: center; margin: 0;">Online Patient Registration</h1>
        <p style="color: #e9fbff; text-align: center; margin: 6px 0 0;">Register for Laboratory Testing</p>
    </header>

    <nav>
        <a href="index.html">Home</a> |
        <a href="laboratory-tests.html">Laboratory Tests</a> |
        <a href="test-details.html">Test Details</a> |
        <a href="gallery.html">Gallery</a> |
        <a href="test-price-table.html">Test Prices</a>
    </nav>

    <main>

        <form>

            <fieldset>

                <legend>Patient Information</legend>

                <label for="name">Patient Name:</label>
                <input type="text"
                       id="name"
                       name="name"
                       placeholder="Enter your full name"
                       required
                       autofocus>
                <br><br>

                <label for="age">Age:</label>
                <input type="number"
                       id="age"
                       name="age"
                       placeholder="Enter age"
                       min="1"
                       max="120"
                       required>
                <br><br>

                <label>Gender:</label>

                <input type="radio"
                       id="male"
                       name="gender"
                       value="Male"
                       required>

                <label for="male">Male</label>

                <input type="radio"
                       id="female"
                       name="gender"
                       value="Female">

                <label for="female">Female</label>

                <input type="radio"
                       id="other"
                       name="gender"
                       value="Other">

                <label for="other">Other</label>

                <br><br>

                <label for="mobile">Mobile Number:</label>
                <input type="tel"
                       id="mobile"
                       name="mobile"
                       placeholder="10-digit mobile number"
                       pattern="[0-9]{10}"
                       required>

                <br><br>

                <label for="email">Email:</label>
                <input type="email"
                       id="email"
                       name="email"
                       placeholder="example@email.com"
                       required>

                <br><br>

                <label for="dob">Date of Birth:</label>
                <input type="date"
                       id="dob"
                       name="dob"
                       required>

            </fieldset>

            <br>

            <fieldset>

                <legend>Test Information</legend>

                <label for="test">Select Test:</label>

                <select id="test"
                        name="test"
                        required>

                    <option value="">-- Select a Test --</option>
                    <option value="cbc">CBC</option>
                    <option value="hba1c">HbA1c</option>
                    <option value="urine">Urine Routine</option>
                    <option value="lft">Liver Function Test</option>
                    <option value="kft">Kidney Function Test</option>

                </select>

                <br><br>

                <label for="appointment">
                    Preferred Appointment Date:
                </label>

                <input type="date"
                       id="appointment"
                       name="appointment"
                       required>

                <br><br>

                <label for="collection">
                    Sample Collection Preference:
                </label>

                <select id="collection"
                        name="collection"
                        required>

                    <option value="">-- Select Preference --</option>
                    <option value="laboratory">
                        Laboratory Visit
                    </option>

                    <option value="home">
                        Home Sample Collection
                    </option>

                </select>

                <br><br>

                <label for="prescription">
                    Upload Doctor Prescription:
                </label>

                <input type="file"
                       id="prescription"
                       name="prescription"
                       accept=".pdf,.jpg,.jpeg,.png">

            </fieldset>

            <br>

            <input type="submit" value="Register Patient">
            <input type="reset" value="Clear Form">

        </form>

    </main>

    <footer class="site-footer">
        <p>&copy; 2026 Clinical Laboratory Management System</p>
    </footer>

</body>
</html>
